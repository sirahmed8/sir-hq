:root {

  --accent-soft: #D3EEEA;
  --ok: #15803D;
  --ok-soft: #DCFCE7;
  --warn: #B45309;
  --warn-soft: #FEF3C7;
  --bad: #B91C1C;
  --bad-soft: #FEE2E2;
  --track: #E2E8F0;
  --card: var(--surface);
  --text: var(--ink);
  --border: var(--line);
  --f-display: "IBM Plex Sans Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {

    --accent-soft: #133936;
    --ok: #4ADE80;
    --ok-soft: #143522;
    --warn: #FBBF24;
    --warn-soft: #382D10;

  }
}

  --accent: #2DD4BF;
  --accent-soft: #133936;
  --ok: #4ADE80;
  --ok-soft: #143522;
  --warn: #FBBF24;

  --bad-soft: #3B1B1B;
  --track: #1F2B37;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #EDF1F4;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #566878;
  --line: #D5DCE3;
  --accent: #0F766E;
  --accent-soft: #D3EEEA;
  --ok: #15803D;
  --ok-soft: #DCFCE7;
  --warn: #B45309;
  --warn-soft: #FEF3C7;
  --bad: #B91C1C;
  --bad-soft: #FEE2E2;

}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html { scroll-behavior: smooth; font-size: 14px; }
input, textarea, [contenteditable="true"] { user-select: text; -webkit-user-select: text; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  transition: background-color .2s ease, color .2s ease;
  touch-callout: none;
}

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

h1, h2, h3 { font-family: var(--f-display); margin: 0; }
h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }

.label {
  font: 600 11px/1 var(--f-display);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
}
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 12px; }

/* Header & Nav */
header {

  flex-wrap: wrap;
  gap: 16px 24px;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
}
.header-brand {

  align-items: center;
  gap: 16px;
}
.brand-logo-wrap {
  width: 52px;
  height: 52px;
  min-width: 52px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
  flex-shrink: 0;
}
.brand-logo-wrap:hover {

  box-shadow: 0 6px 20px rgba(45, 212, 191, 0.25);
}
.brand-logo {
  width: 100%;

}
header p { margin: 4px 0 0; color: var(--muted); max-width: 68ch; font-size: 13px; }
.header-toolbar {
  display: flex;
  flex-wrap: wrap;

}
.status-strip {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.status-strip .chip {

}
.status-strip .chip.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

nav {

  z-index: 25;
  display: flex;

nav .nav-tab:active {

}
nav .nav-tab:focus-visible {
  box-shadow: 0 0 0 2px var(--accent);

}
nav .nav-tab.active {
  background: var(--surface);

}
