</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Navigation">
    <div class="side-brand" data-i18n="brand">SIR Control Room</div>
    <nav class="side-nav" id="nav-side" aria-label="Sections"></nav>
  </aside>
  <div class="shell">
    <header class="topbar" id="topbar">
      <div class="brand" data-i18n="brand">SIR Control Room</div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-set="system" aria-pressed="true" data-i18n="themeSystem">System</button>
        <button type="button" data-theme-set="light" aria-pressed="false" data-i18n="themeLight">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false" data-i18n="themeDark">Dark</button>
      </div>
      <button type="button" class="menu-btn" id="lang-btn" aria-label="Language"></button>
    </header>
    <main class="main" id="main">
      <section class="strip" id="strip" aria-live="polite"></section>
      <div id="view" role="region" aria-live="polite"></div>
    </main>
  </div>
</div>
<nav class="tabbar" id="nav-bottom" aria-label="Sections"></nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
  <div class="grab" aria-hidden="true"></div>
  <h3 id="sheet-title"></h3>
  <div class="sheet-body" id="sheet-body"></div>
</section>
<div class="ctx" id="ctx" role="menu" hidden>
  <button type="button" role="menuitem" id="ctx-refresh" data-i18n="refresh">Refresh</button>
  <button type="button" role="menuitem" id="ctx-copy-time" data-i18n="copyTime">Copy update time</button>
</div>
