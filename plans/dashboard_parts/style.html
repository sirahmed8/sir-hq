<style>
/* Tokens: one palette, light by default, dark through prefers-color-scheme or the toggle. */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #EEF0F3;
  --ink: #11151B;
  --muted: #5B6573;
  --line: #DDE1E7;
  --accent: #1D5FD0;
  --accent-ink: #FFFFFF;
  --ok: #1B7A3E;
  --ok-soft: #DDF3E4;
  --warn: #9A5B00;
  --warn-soft: #FCEFD2;
  --bad: #B3261E;
  --bad-soft: #F9E0DE;
  --idle: #5B6573;
  --idle-soft: #E7EAEE;
  --shadow: 0 1px 2px rgba(17,21,27,.06), 0 4px 16px rgba(17,21,27,.06);
  --r-control: 8px;
  --r-card: 12px;
  --r-sheet: 16px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --spring: cubic-bezier(.2, .9, .25, 1.12);
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Segoe UI Variable", Roboto, "Noto Sans", "Noto Sans Arabic", "Tahoma", "Arial", sans-serif;
  --f-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1116;
    --surface: #161B22;
    --surface-2: #1D242D;
    --ink: #E8ECF1;
    --muted: #9AA6B4;
    --line: #2A323D;
    --accent: #6CA6FF;
    --accent-ink: #0B1220;
    --ok: #5BD384;
    --ok-soft: #14331F;
    --warn: #F2B94B;
    --warn-soft: #3A2E12;
    --bad: #FF8A80;
    --bad-soft: #3D1B19;
    --idle: #9AA6B4;
    --idle-soft: #1F2630;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1116;
  --surface: #161B22;
  --surface-2: #1D242D;
  --ink: #E8ECF1;
  --muted: #9AA6B4;
  --line: #2A323D;
  --accent: #6CA6FF;
  --accent-ink: #0B1220;
  --ok: #5BD384;
  --ok-soft: #14331F;
  --warn: #F2B94B;
  --warn-soft: #3A2E12;
  --bad: #FF8A80;
  --bad-soft: #3D1B19;
  --idle: #9AA6B4;
  --idle-soft: #1F2630;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.55 var(--f-body);
  overflow-x: clip;
  min-height: 100vh;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
p { text-wrap: pretty; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-control); }
[hidden] { display: none !important; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
bdi { unicode-bidi: isolate; }

/* Shell: sidebar on wide screens, top header plus bottom tab bar on phones. */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.side { display: none; }
.main { min-width: 0; padding: var(--s4); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  padding: calc(var(--s3) + env(safe-area-inset-top, 0px)) var(--s4) var(--s3);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 650; font-size: 15px; margin-inline-end: auto; min-width: 0; overflow-wrap: anywhere; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-control); padding: 2px; gap: 2px; }
.seg button { min-height: 32px; padding: 0 var(--s3); border-radius: 6px; font-size: 13px; color: var(--muted); transition: transform .18s var(--spring), background-color .18s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button:active { transform: scale(.98); }
.menu-btn { min-height: 32px; min-width: 32px; padding: 0 var(--s2); border-radius: var(--r-control); background: var(--surface-2); color: var(--ink); font-size: 13px; transition: transform .18s var(--spring); }
.menu-btn:active { transform: scale(.98); }

/* Status strip */
.strip { display: grid; gap: var(--s2); margin-bottom: var(--s4); }
.strip-row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px var(--s2); border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--idle-soft); color: var(--idle); max-width: 100%; overflow-wrap: anywhere; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.plain::before { display: none; }
.banner {
  display: grid; gap: var(--s1); padding: var(--s3) var(--s4); border-radius: var(--r-card);
  background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
}
.banner strong { color: var(--warn); }
.banner.stale { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.banner.stale strong { color: var(--bad); }
.banner p { color: var(--ink); font-size: 13px; overflow-wrap: break-word; }

/* Cards and sections */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; margin: var(--s5) 0 var(--s3); }
.section-head:first-child { margin-top: 0; }
.section-head h2 { font-size: 16px; font-weight: 650; min-width: 0; overflow-wrap: break-word; }
.section-head .meta { color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: var(--s3); grid-template-columns: 1fr; min-width: 0; }
.card {
  display: grid; gap: var(--s2); min-width: 0; padding: var(--s4);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
}
.card-title { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: break-word; }
.card-sub { color: var(--muted); font-size: 13px; overflow-wrap: break-word; }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; min-width: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--s3); font-size: 13px; min-width: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: break-word; }
.rlabel { display: inline-flex; align-items: center; min-height: 24px; padding: 2px var(--s2); border-radius: 6px; font-size: 12px; font-family: var(--f-num); background: var(--surface-2); color: var(--ink); direction: ltr; }
.rlabel.verified { background: var(--ok-soft); color: var(--ok); }
.rlabel.failed { background: var(--bad-soft); color: var(--bad); }
.rlabel.open { background: var(--warn-soft); color: var(--warn); }

/* Buttons and tactile feedback */
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 var(--s4);
  border-radius: var(--r-control); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px;
  transition: transform .18s var(--spring), opacity .18s;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn:active { transform: scale(.98); }
.linkish { color: var(--accent); font-size: 13px; min-height: 40px; display: inline-flex; align-items: center; padding: 0 var(--s2); border-radius: var(--r-control); }
.linkish:active { transform: scale(.98); }

/* Five states */
.skel { display: grid; gap: var(--s2); }
.skel span { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skel span.tall { height: 72px; border-radius: var(--r-card); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.empty, .errbox { display: grid; gap: var(--s2); justify-items: start; padding: var(--s5) var(--s4); border: 1px dashed var(--line); border-radius: var(--r-card); color: var(--muted); }
.errbox { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--ink); }
.more { justify-self: start; }

/* Tab bar (phones) */
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity;
  padding: var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; min-width: 64px; min-height: 48px; padding: var(--s1) var(--s2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border-radius: var(--r-control); color: var(--muted); font-size: 11px; line-height: 1.2; scroll-snap-align: center;
  transition: transform .18s var(--spring), background-color .18s, color .18s;
}
.tab:active { transform: scale(.98); }
.tab[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 650; }
.tab .count { font-family: var(--f-num); font-size: 10px; color: var(--muted); }
.side-nav { display: none; }
.side-tab { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 40px; padding: 0 var(--s3); border-radius: var(--r-control); color: var(--ink); font-size: 14px; width: 100%; text-align: start; transition: transform .18s var(--spring), background-color .18s; }
.side-tab:active { transform: scale(.98); }
.side-tab[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); font-weight: 600; }
.side-tab .count { font-family: var(--f-num); color: var(--muted); font-size: 12px; }

/* Sheet (drawer): spring open and matching close */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,10,14,.42); opacity: 0; transition: opacity .24s var(--spring); }
.scrim.on { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; inset-inline: 0; bottom: 0; max-height: 82vh; overflow: auto;
  background: var(--surface); color: var(--ink); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  border-top: 1px solid var(--line); box-shadow: var(--shadow);
  padding: var(--s4) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
  transform: translateY(104%); transition: transform .34s var(--spring);
  overscroll-behavior: contain;
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto var(--s3); }
.sheet h3 { font-size: 16px; font-weight: 650; margin-bottom: var(--s3); overflow-wrap: break-word; }
.sheet-body { display: grid; gap: var(--s3); min-width: 0; }
.sheet pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--f-num); color: var(--muted); }

/* Own context menu */
.ctx {
  position: fixed; z-index: 50; min-width: 180px; padding: var(--s1);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
  transform-origin: top left; transform: scale(.94); opacity: 0; pointer-events: none;
  transition: transform .22s var(--spring), opacity .18s;
}
.ctx.on { transform: scale(1); opacity: 1; pointer-events: auto; }
.ctx button { display: flex; width: 100%; min-height: 40px; padding: 0 var(--s3); align-items: center; border-radius: 6px; font-size: 14px; text-align: start; }
.ctx button:active { background: var(--surface-2); transform: scale(.98); }

/* Tables become cards on phones; wide tables scroll inside their own box only. */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: start; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
.tbl th { color: var(--muted); font-weight: 550; font-size: 12px; }

/* Desktop shell */
@media (min-width: 1024px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: var(--s2); position: sticky; top: 0; height: 100vh; padding: var(--s4); border-inline-end: 1px solid var(--line); background: var(--surface); }
  .side-brand { font-weight: 650; font-size: 15px; padding: var(--s2) var(--s3) var(--s4); }
  .side-nav { display: grid; gap: 2px; }
  .tabbar { display: none; }
  .main { padding: var(--s5) var(--s6) var(--s7); }
  .topbar .brand { display: none; }
  .topbar { padding-inline: var(--s6); }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .sheet { inset-inline: auto 0; top: 0; bottom: 0; width: min(440px, 92vw); max-height: none; border-radius: var(--r-sheet) 0 0 var(--r-sheet); transform: translateX(104%); border-top: 0; border-inline-start: 1px solid var(--line); padding-top: var(--s5); }
  [dir="rtl"] .sheet { transform: translateX(-104%); }
  .sheet.on, [dir="rtl"] .sheet.on { transform: translateX(0); }
  .sheet .grab { display: none; }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .grid.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}
</style>
