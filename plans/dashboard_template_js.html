<script>
const D = /*__DATA__*/{};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
const P = D.projects || [];
const bySlug = Object.fromEntries(P.map((p) => [p.slug, p]));

// Preferences Controller (Theme, Density, Dynamic Island Settings Dialog)
let themeMode = localStorage.getItem("sir_theme_mode") || localStorage.getItem("sir_theme") || "system";
let densityMode = localStorage.getItem("sir_density") || "comfortable";

function applyTheme(mode) {
  themeMode = mode;
  localStorage.setItem("sir_theme_mode", mode);
  localStorage.setItem("sir_theme", mode);
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const effectiveTheme = mode === "system" ? (sysDark ? "dark" : "light") : mode;
  document.documentElement.setAttribute("data-theme", effectiveTheme);
  
  document.querySelectorAll("[data-theme-val]").forEach(btn => {
    const isSelected = btn.dataset.themeVal === mode;
    btn.classList.toggle("active", isSelected);
    btn.setAttribute("aria-checked", isSelected ? "true" : "false");
  });
}

function applyDensity(density) {
  densityMode = density;
  localStorage.setItem("sir_density", density);
  if (density === "compact") {
    document.documentElement.setAttribute("data-density", "compact");
  } else {
    document.documentElement.removeAttribute("data-density");
  }
  document.querySelectorAll("[data-density-val]").forEach(btn => {
    const isSelected = btn.dataset.densityVal === density;
    btn.classList.toggle("active", isSelected);
    btn.setAttribute("aria-checked", isSelected ? "true" : "false");
  });
}

// System color scheme change listener
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    if (themeMode === "system") {
      document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
    }
  });
}

applyTheme(themeMode);
applyDensity(densityMode);

// Focus Trapping & Accessibility Management (WCAG 2.1 AA)
let activeTrapElement = null;
let previousFocusedBeforeTrap = null;

function trapFocus(container) {
  previousFocusedBeforeTrap = document.activeElement;
  const getFocusables = () => Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
  const focusables = getFocusables();
  if (focusables.length > 0) {
    setTimeout(() => focusables[0].focus(), 50);
  }
  function handleTrap(e) {
    if (e.key !== "Tab") return;
    const fList = getFocusables();
    if (!fList.length) return;
    const first = fList[0];
    const last = fList[fList.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first || !container.contains(document.activeElement)) {
        e.preventDefault();
        last.focus();
      }
    } else {
      if (document.activeElement === last || !container.contains(document.activeElement)) {
        e.preventDefault();
        first.focus();
      }
    }
  }
  if (container._trapHandler) container.removeEventListener("keydown", container._trapHandler);
  container._trapHandler = handleTrap;
  container.addEventListener("keydown", handleTrap);
}

function releaseFocus(container, fallbackTrigger) {
  if (container && container._trapHandler) {
    container.removeEventListener("keydown", container._trapHandler);
    container._trapHandler = null;
  }
  const target = previousFocusedBeforeTrap || fallbackTrigger;
  if (target && typeof target.focus === "function") {
    target.focus();
  }
  previousFocusedBeforeTrap = null;
}

// Settings Popover / Dialog
const settingsModal = $("#settings-modal");
const settingsBackdrop = $("#settings-backdrop");
const settingsBtn = $("#settings-btn");
const settingsCloseBtn = $("#settings-close-btn");

function openSettings() {
  settingsModal.classList.add("open");
  settingsBackdrop.classList.add("open");
  settingsBtn.setAttribute("aria-expanded", "true");
  trapFocus(settingsModal);
}

function closeSettings() {
  if (!settingsModal.classList.contains("open")) return;
  settingsModal.classList.remove("open");
  settingsBackdrop.classList.remove("open");
  settingsBtn.setAttribute("aria-expanded", "false");
  releaseFocus(settingsModal, settingsBtn);
}

settingsBtn.addEventListener("click", () => {
  if (settingsModal.classList.contains("open")) {
    closeSettings();
  } else {
    openSettings();
  }
});
settingsCloseBtn.addEventListener("click", closeSettings);
settingsBackdrop.addEventListener("click", closeSettings);

// Side Menu Drawer (Responsive)
const sidebarEl = $("#app-sidebar");
const drawerBackdrop = $("#drawer-backdrop");
const mobileMenuTrigger = $("#mobile-menu-trigger");
const drawerCloseBtn = $("#drawer-close-btn");

function updateSidebarAria() {
  if (window.innerWidth < 1024) {
    sidebarEl.setAttribute("aria-hidden", sidebarEl.classList.contains("open") ? "false" : "true");
  } else {
    sidebarEl.removeAttribute("aria-hidden");
  }
}
let resizeRafId = null;
window.addEventListener("resize", () => {
  if (resizeRafId) cancelAnimationFrame(resizeRafId);
  resizeRafId = requestAnimationFrame(() => {
    updateSidebarAria();
  });
});
updateSidebarAria();

function openSidebarDrawer() {
  sidebarEl.classList.remove("closing");
  sidebarEl.classList.add("open");
  drawerBackdrop.classList.add("open");
  sidebarEl.setAttribute("aria-hidden", "false");
  if (mobileMenuTrigger) mobileMenuTrigger.setAttribute("aria-expanded", "true");
  trapFocus(sidebarEl);
}

function closeSidebarDrawer() {
  if (!sidebarEl.classList.contains("open")) return;
  sidebarEl.classList.add("closing");
  sidebarEl.classList.remove("open");
  drawerBackdrop.classList.remove("open");
  if (window.innerWidth < 1024) sidebarEl.setAttribute("aria-hidden", "true");
  if (mobileMenuTrigger) mobileMenuTrigger.setAttribute("aria-expanded", "false");
  setTimeout(() => sidebarEl.classList.remove("closing"), 300);
  releaseFocus(sidebarEl, mobileMenuTrigger);
}

if (mobileMenuTrigger) mobileMenuTrigger.addEventListener("click", openSidebarDrawer);
if (drawerCloseBtn) drawerCloseBtn.addEventListener("click", closeSidebarDrawer);
if (drawerBackdrop) drawerBackdrop.addEventListener("click", closeSidebarDrawer);

// Escape key to dismiss modals/drawers
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (settingsModal.classList.contains("open")) closeSettings();
    if (sidebarEl.classList.contains("open")) closeSidebarDrawer();
  }
});

// Settings Modal theme & density buttons
document.querySelectorAll("[data-theme-val]").forEach(btn => {
  btn.addEventListener("click", () => applyTheme(btn.dataset.themeVal));
});
document.querySelectorAll("[data-density-val]").forEach(btn => {
  btn.addEventListener("click", () => applyDensity(btn.dataset.densityVal));
});

// Telemetry refresh button in Settings
$("#set-refresh-btn").addEventListener("click", () => {
  const btn = $("#set-refresh-btn");
  const txt = $("#txt-refresh-now");
  const t = i18n[currentLang] || i18n.en;
  btn.disabled = true;
  txt.textContent = t.refreshing;
  setTimeout(() => {
    window.location.reload();
  }, 450);
});

// Print / PDF Export Report Handler
const printReportBtn = $("#print-report-btn");
if (printReportBtn) {
  printReportBtn.addEventListener("click", () => {
    closeSettings();
    setTimeout(() => {
      window.print();
    }, 300);
  });
}
