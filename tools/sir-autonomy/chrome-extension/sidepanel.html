<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIR Autonomy Companion</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: rgba(22, 24, 30, 0.75);
      --card-hover: rgba(30, 33, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --purple: #c084fc;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar */
    .topbar {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(20px);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .orb-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      box-shadow: 0 0 12px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #fff;
      font-weight: bold;
    }
    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .nav-btn {
      padding: 4px 10px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      transition: all 0.3s;
    }
    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
    }

    /* Views container */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .view.active {
      display: flex;
    }

    /* Chat View */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .empty-state {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 24px 8px;
    }
    .hero-orb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #a855f7 60%, #1e1b4b 100%);
      box-shadow: 0 0 24px var(--accent-glow);
      animation: pulse 4s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px #38bdf8); }
    }
    .hero-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .active-tab-badge {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 280px;
      margin-top: 6px;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .chip:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Message Bubbles */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 92%;
    }
    .msg.user {
      align-self: flex-end;
    }
    .msg.assistant {
      align-self: flex-start;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      line-height: 1.5;
      user-select: text;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .msg-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px;
      border-radius: 6px;
      margin: 6px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 11px;
    }

    /* Composer Dock */
    .composer-dock {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .composer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .composer-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .composer-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      resize: none;
      max-height: 120px;
      min-height: 38px;
      line-height: 1.4;
      font-family: inherit;
      width: 100%;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }
    .composer-actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
    }
    .btn-icon.listening {
      background: var(--danger);
      animation: pulse-red 1s infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(248, 113, 113, 0); }
    }
    .model-badge {
      font-size: 11px;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
    }
    .btn-send {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-send:hover {
      background: #7dd3fc;
      transform: scale(1.05);
    }

    /* Engine View */
    .engine-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .active-tab-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .active-tab-url {
      font-size: 11px;
      color: var(--accent);
      word-break: break-all;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }
    .log-list {
      flex: 1;
      overflow-y: auto;
      max-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-family: monospace;
      font-size: 11px;
    }
    .log-entry {
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-cmd { color: var(--accent); font-weight: 600; }
    .log-desc { color: var(--muted); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <div class="orb-icon">✦</div>
      <span>SIR Autonomy</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tabCompanion">💬 Chat</button>
      <button class="nav-btn" id="tabEngine">⚡ Engine</button>
    </div>
    <div class="status-pill" id="statusPill" title="SIR Autonomy Bridge Status">
      <span class="dot" id="statusDot"></span>
      <span id="statusLabel">Checking...</span>
    </div>
  </div>

  <!-- Main Views Container -->
  <div class="view-container">

    <!-- View 1: Companion Chat -->
    <div class="view active" id="viewCompanion">
      <div class="chat-stream" id="chatStream">
        <div class="empty-state" id="emptyState">
          <div class="hero-orb">✦</div>
          <div class="hero-title">How can I help you today?</div>
          <div class="active-tab-badge" id="activeTabBadge">Loading active tab...</div>
          <div class="quick-chips">
            <button class="chip" id="chipSummarize">📄 Summarize this tab</button>
            <button class="chip" id="chipExtract">🔍 Extract main text & forms</button>
            <button class="chip" id="chipScreenshot">📸 Capture tab snapshot</button>
            <button class="chip" id="chipDesktop">🖥️ Full desktop screenshot</button>
          </div>
        </div>
      </div>

      <!-- Input Dock -->
      <div class="composer-dock">
        <div class="composer-card">
          <textarea class="composer-textarea" id="promptInput" placeholder="Ask SIR Autonomy about this tab..." rows="1"></textarea>
          <div class="composer-toolbar">
            <div class="composer-actions-left">
              <button class="btn-icon" id="btnPageContext" title="Attach Page Text">📄</button>
              <button class="btn-icon" id="btnMic" title="Voice Input">🎙️</button>
              <span class="model-badge">SIR Engine</span>
            </div>
            <button class="btn-send" id="btnSend" title="Send message">↑</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View 2: Engine & Bridge Telemetry -->
    <div class="view" id="viewEngine">
      <div class="engine-stream">
        <div class="panel-card">
          <div class="panel-header">
            <span>Active Browser Tab</span>
            <span id="tabCountBadge">1 Tab</span>
          </div>
          <div class="active-tab-title" id="engineTabTitle">Detecting...</div>
          <div class="active-tab-url" id="engineTabUrl">---</div>
          <div class="grid-2" style="margin-top: 6px;">
            <button class="btn-action" id="btnRefreshActiveTab">🔄 Refresh</button>
            <button class="btn-action" id="btnInspectSnapshot">📸 DOM Snapshot</button>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <span>Autonomous Actions</span>
            <span style="color: var(--accent);">Zero-Prompt</span>
          </div>
          <div class="grid-2">
            <button class="btn-action" id="btnCaptureScreen">🖼️ Tab Image</button>
            <button class="btn-action" id="btnListAllTabs">📑 All Tabs</button>
            <button class="btn-action" id="btnDesktopSnap">🖥️ Desktop</button>
            <button class="btn-action" id="btnReconnectBridge">⚡ Reconnect</button>
          </div>
        </div>

        <div class="panel-card" style="flex: 1;">
          <div class="panel-header">
            <span>Live Agent Activity</span>
            <span id="logCount">0 events</span>
          </div>
          <div class="log-list" id="logList">
            <div class="log-entry">
              <span class="log-cmd">READY</span>
              <span class="log-desc">Bridge listener active</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
